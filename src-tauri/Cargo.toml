[package]
name = "tra-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Tra — look up any word you select, without leaving what you are reading"
authors = ["Vu Duc Tuan"]

[lib]
# The `_lib` suffix is required so the lib name does not collide with the bin
# name on Windows. See rust-lang/cargo#8519.
name = "tra_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tra-core = { path = "../crates/tra-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-autostart = "2.5.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSWindow", "NSResponder", "NSApplication"] }
objc2-foundation = "0.3.2"
