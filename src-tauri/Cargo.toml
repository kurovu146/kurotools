[package]
name = "tra-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Tra — look up any word you select, without leaving what you are reading"
authors = ["Vu Duc Tuan"]

[lib]
# The `_lib` suffix is required so the lib name does not collide with the bin
# name on Windows. See rust-lang/cargo#8519.
name = "tra_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tra-core = { path = "../crates/tra-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-autostart = "2.5.1"
window-vibrancy = "0.8.0"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2", version = "2.0.1" }
